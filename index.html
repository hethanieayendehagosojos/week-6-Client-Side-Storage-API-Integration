<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local Storage</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body class="github-start">
    <!-- Header and Navigation -->
    <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-blue">
  <div class="container-fluid">
    <a id="site-title" class="navbar-brand" href="#">WEATHER NAVIGATION</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a id="nav-home" class="nav-link" href="#home">Home</a></li>
        <li class="nav-item"><a id="nav-preferences" class="nav-link" href="#preferences">User preference</a></li>
        <li class="nav-item"><a id="nav-weather" class="nav-link" href="#weather">Weather</a></li>
        <li class="nav-item"><a id="nav-map" class="nav-link" href="#map">Map</a></li>
      </ul>
    </div>
  </div>
</nav>
    </header>




   <!-- GitHub User Lookup -->
    <section id="github" class="content-box container my-5 text-center">
        <h2>GitHub User Lookup</h2>
        <form id="github-search-form" class="github-search" onsubmit="getUser(event)">
            <label for="github-username" class="visually-hidden">GitHub username</label>
            <input type="text" id="github-username" placeholder="Enter GitHub Username" required autofocus>
            <button type="submit">Get User</button>
        </form>
        <div id="userResult" class="github-result" aria-live="polite"></div>
    </section>



    <!-- Main Content -->
    <main>
        <!-- Welcome -->
        <section id="home" class="text-center p-5">
            <p id="display" class="welcome-message"></p>
        </section>

         <!-- Home -->
        <section class="name-box text-center p-5" aria-labelledby="name-heading">
            <h2 id="name-heading">WELCOME</h2>
            <label for="username">Enter your name:</label>
            <input type="text" id="username" placeholder="name" autofocus>
            <button onclick="saveData()">Save</button>
            <button onclick="loadData()">Load</button>
        </section>

        <!-- Preferences -->
        <section id="preferences" class="content-box container my-5">
            <h2>User Preferences</h2>
            <label class="form-label mt-3">
                Choose Theme:
            </label>

            <select id="theme" class="form-select mb-3">
                <option value="light">Light Mode</option>
                <option value="dark">Dark Mode</option>
            </select>

            <label class="form-label">
                Choose Language:
            </label>

            <select id="language" class="form-select mb-3">
                <option value="english">English</option>
                <option value="filipino">Filipino</option>
                <option value="spanish">Spanish</option>
            </select>

            <button onclick="savePreferences()" class="btn btn-primary">
                Save Preferences
            </button>
            <p id="message" class="mt-3"></p>
        </section>

        <!-- Weather -->
        <section id="weather" class="content-box container my-5">
             <h2>Weather Checker</h2>
           <input type="text" id="city" placeholder="Enter city name">
            <button onclick="getWeather()">Get Weather</button>
        <p id="weatherResult"></p>
        </section>
        </main>




   <!-- Map -->
    <section id="map" class="content-box container my-5 text-center">
        <h2>Location Map</h2>
        <form id="location-search-form" class="location-search" role="search">
            <label for="location-input" class="visually-hidden">Search for a location</label>
            <input type="search" id="location-input" placeholder="Search for a place" required>
            <button type="submit">Search</button>
        </form>
        <p id="search-status" role="status"></p>
        <div id="live-map" aria-label="Real-time location map"></div>
        <p id="location-status" role="status">Requesting your location...</p>
   </section>





   
    <!-- Footer -->
    <footer class="bg-primary text-white text-center p-3">
        <p class="mb-0">
            2025 My Webpage. All Rights Reserved.
        </p>
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>

</body>

</html>
